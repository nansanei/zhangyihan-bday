<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#050409"/>
<title>生日快乐</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050409;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#fff3e2;position:fixed;inset:0;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  }
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
  #bg{z-index:1}
  #fx{z-index:2}

  /* 文字层 */
  #copy{position:absolute;z-index:3;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));
        padding:0 9vw;text-align:center;pointer-events:none;transition:opacity .8s ease}
  #copy p{margin:0 0 .5em;font-size:clamp(15px,4.05vw,18.5px);line-height:1.9;letter-spacing:.02em;
          color:rgba(255,240,224,.93);opacity:0;transform:translateY(12px);filter:blur(7px);
          transition:opacity 1.15s ease,transform 1.15s ease,filter 1.15s ease;
          text-shadow:0 2px 20px rgba(0,0,0,.85)}
  #copy p.on{opacity:1;transform:none;filter:none}

  /* 按钮层 */
  #ui{position:absolute;z-index:4;inset:0;pointer-events:none}
  .pill{
    display:inline-block;pointer-events:auto;font-family:inherit;font-size:14.5px;letter-spacing:.08em;
    padding:13px 26px;border-radius:999px;color:#ffe4bd;cursor:pointer;
    border:1px solid rgba(255,208,150,.34);background:rgba(255,208,150,.07);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:opacity .9s ease, background .2s ease, transform .12s ease;
  }
  .pill:active{transform:scale(.97);background:rgba(255,208,150,.14)}

  #next{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
        transform:translateX(-50%);opacity:0;visibility:hidden}
  #next.on{opacity:1;visibility:visible}

  /* 吹蜡烛场景 UI */
  #cakeUI{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
  #cakeUI.on{opacity:1}
  #cakeHint{
    position:absolute;left:0;right:0;bottom:calc(146px + env(safe-area-inset-bottom));
    text-align:center;font-size:14.5px;letter-spacing:.05em;color:rgba(255,232,206,.72);
    padding:0 10vw;line-height:1.7;transition:opacity .6s ease
  }
  #micBtn{position:absolute;left:50%;transform:translateX(-50%);
          bottom:calc(64px + env(safe-area-inset-bottom))}
  #holdBtn{position:absolute;left:50%;transform:translateX(-50%);
           bottom:calc(64px + env(safe-area-inset-bottom));display:none}
  #meter{position:absolute;left:50%;transform:translateX(-50%);
         bottom:calc(104px + env(safe-area-inset-bottom));width:min(54vw,240px);height:4px;
         border-radius:4px;background:rgba(255,220,180,.15);overflow:hidden;display:none}
  #meter i{display:block;height:100%;width:0%;border-radius:4px;
           background:linear-gradient(90deg,#ffb066,#ffd9a0,#fff3e2);
           transition:width .08s linear}
  #wishOut{
    position:absolute;left:0;right:0;bottom:calc(116px + env(safe-area-inset-bottom));text-align:center;padding:0 8vw;
    font-size:clamp(17px,4.8vw,24px);letter-spacing:.14em;line-height:1.6;
    color:#ffe9cc;opacity:0;transform:translateY(14px);filter:blur(9px);
    transition:opacity 1.4s ease .35s, transform 1.4s ease .35s, filter 1.4s ease .35s;
    text-shadow:0 2px 30px rgba(255,170,90,.35),0 0 60px rgba(255,140,70,.22)
  }
  #wishOut.on{opacity:1;transform:none;filter:none}
  #replayRow{position:absolute;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));
             display:flex;justify-content:center;gap:10px;
             opacity:0;visibility:hidden;transition:opacity 1s ease}
  #replayRow.on{opacity:1;visibility:visible}

  /* 开场门 */
  #gate{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:22px;
        background:radial-gradient(120% 90% at 50% 40%,#120e1e 0%,#08060f 55%,#040308 100%);
        transition:opacity 1.1s ease}
  #gate.off{opacity:0;pointer-events:none}
  #gate .dot{width:9px;height:9px;border-radius:50%;background:#ffcf94;
             box-shadow:0 0 22px 6px rgba(255,180,110,.45);animation:br 2.6s ease-in-out infinite}
  @keyframes br{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  #gate span{font-size:14.5px;letter-spacing:.22em;color:rgba(255,226,196,.62)}
  #gate em{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-style:normal;
          font-size:10.5px;letter-spacing:.06em;color:rgba(255,226,196,.22)}

  #fade{position:fixed;inset:0;z-index:7;background:#040308;opacity:0;pointer-events:none;
        transition:opacity .65s ease}
  #fade.on{opacity:1}

  #mute{position:absolute;z-index:5;right:14px;top:calc(12px + env(safe-area-inset-top));
        pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,220,180,.18);
        background:rgba(255,220,180,.05);color:rgba(255,226,196,.6);font-size:15px;line-height:1;
        display:flex;align-items:center;justify-content:center;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<!-- ==================================================================
     改这里：你只需要动下面这个 CONFIG
     ================================================================== -->
<script>
var CONFIG = {
  greet: "生日快乐",          // 烟花最后聚成的大字
  name:  "张弈涵",            // 聚在下面的名字／昵称（改这里！）
  lines: [                    // 烟花散开后一行一行浮出来的话，一句一行，别写太长
    "今天是你生日，先说一句生日快乐。",
    "这一年挺快的，好像没过多久就到现在了。",
    "希望你以后少熬点夜，想做的事都能做成。",
    "还有，认识你挺走运的。"
  ],
  wish: "许个愿吧",           // 吹灭蜡烛之后出现的那句
  sign: ""                     // 落款，不想留就空着
};
</script>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="copy"></div>

<div id="ui">
  <button id="mute" title="声音">♪</button>
  <button class="pill" id="next">还有一件事 →</button>

  <div id="cakeUI">
    <p id="cakeHint">对着手机，轻轻吹一口气。</p>
    <div id="meter"><i id="meterFill"></i></div>
    <button class="pill" id="micBtn">点我开始吹</button>
    <button class="pill" id="holdBtn">按住这里吹</button>
    <p id="wishOut"></p>
    <div id="replayRow">
      <button class="pill" id="again">重看一遍</button>
      <button class="pill" id="replay">再吹一次</button>
    </div>
  </div>
</div>

<div id="fade"></div>
<div id="gate"><div class="dot"></div><span>点一下</span><em>♪ Kevin MacLeod · CC BY 4.0</em></div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
/* =====================================================================
   0. 基础
   ===================================================================== */
var bg = document.getElementById('bg'), bctx = bg.getContext('2d');
var fx = document.getElementById('fx'), ctx = fx.getContext('2d');
var W = 0, H = 0, DPR = 1;
var clock = 0, t = 0, started = false, scene = 'fw';
var FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

/* =====================================================================
   1. 尺寸
   ===================================================================== */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  [bg, fx].forEach(function (c) {
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintBg();
  layoutCake();
  // 如果烟花文字已经聚好，窗口变化后重新采样
  if (FW.didMorph) { retargetGreet(); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 260); });

/* =====================================================================
   2. 背景
   ===================================================================== */
var stars = [];
function makeStars() {
  stars = [];
  var n = Math.round(Math.min(150, (W * H) / 9000));
  for (var i = 0; i < n; i++) {
    var sx0 = Math.random() * W, sy0 = Math.random() * H * 0.82;
    stars.push({
      x: sx0, y: sy0, ox: sx0, oy: sy0,
      tx: sx0, ty: sy0,
      r: rnd(0.5, 1.5),
      a: rnd(0.18, 0.75),
      ph: rnd(0, 6.28),
      moving: false, settled: false, age: 0, delay: 0, dur: 1.6
    });
  }
}
function paintBg() {
  bctx.clearRect(0, 0, W, H);
  var g = bctx.createRadialGradient(W * 0.5, H * 0.34, 0, W * 0.5, H * 0.34, Math.max(W, H) * 0.95);
  if (scene === 'cake') {
    g.addColorStop(0, '#1a1120'); g.addColorStop(0.45, '#0c0712'); g.addColorStop(1, '#040307');
  } else {
    g.addColorStop(0, '#141029'); g.addColorStop(0.45, '#0a0714'); g.addColorStop(1, '#040309');
  }
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);

  // 远处一层暖雾
  var g2 = bctx.createRadialGradient(W * 0.5, H * 1.02, 0, W * 0.5, H * 1.02, Math.min(W, H) * 0.62);
  g2.addColorStop(0, 'rgba(88,52,96,0.30)');
  g2.addColorStop(1, 'rgba(88,52,96,0)');
  bctx.fillStyle = g2; bctx.fillRect(0, 0, W, H);

  makeStars();
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    bctx.beginPath();
    bctx.arc(s.x, s.y, s.r, 0, 6.2832);
    bctx.fillStyle = 'rgba(226,232,255,' + s.a + ')';
    bctx.fill();
  }

  // 暗角
  var v = bctx.createRadialGradient(W * 0.5, H * 0.45, Math.min(W, H) * 0.22,
                                    W * 0.5, H * 0.45, Math.max(W, H) * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.62)');
  bctx.fillStyle = v; bctx.fillRect(0, 0, W, H);
}

/* =====================================================================
   3. 声音（音效现场合成；背景音乐单独一个 mp3）
   ===================================================================== */
var AC = null, noiseBuf = null, muted = false;

/* 背景音乐：点「点一下」时开始，3 秒内淡入到很低，只当底噪 */
var BGM_VOL = 0.22;
function startBgm() {
  var b = document.getElementById('bgm');
  if (!b || muted) return;
  try {
    b.volume = 0;
    var p = b.play();
    if (p && p.catch) p.catch(function () {});
    var t0 = Date.now();
    var iv = setInterval(function () {
      var k = (Date.now() - t0) / 3000;
      if (k >= 1) { b.volume = BGM_VOL; clearInterval(iv); return; }
      b.volume = BGM_VOL * k;
    }, 50);
  } catch (e) {}
}
function audioInit() {
  if (AC) return;
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    AC = new C();
    var len = AC.sampleRate * 1.2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function burstSound(dist) {
  if (!AC || muted) return;
  try {
    var src = AC.createBufferSource(); src.buffer = noiseBuf;
    var bp = AC.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(1400, AC.currentTime);
    bp.frequency.exponentialRampToValueAtTime(220, AC.currentTime + 0.5);
    bp.Q.value = 0.7;
    var g = AC.createGain();
    var vol = 0.09 * clamp(1 - dist, 0.25, 1);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime + 0.55);
    src.connect(bp); bp.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime + 0.6);
  } catch (e) {}
}
function launchSound() {
  if (!AC || muted) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(260, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(860, AC.currentTime + 0.28);
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.028, AC.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.32);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.34);
  } catch (e) {}
}
function tone(freq, dur, vol, type) {
  if (!AC || muted) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, AC.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}

/* =====================================================================
   4. 场景一：烟花 → 聚字
   ===================================================================== */
var PALETTES = [
  ['#ffd28a', '#ffb057', '#fff3d0'],
  ['#ff9ab5', '#ff6f9c', '#ffd9e2'],
  ['#cfe4ff', '#9fc2ff', '#ffe6c8'],
  ['#ffe0a8', '#ffc078', '#fffdf2']
];

var FW = {
  sparks: [], rockets: [], flashes: [],
  particles: [], points: [],
  didMorph: false, morphAt: 6.8, copyAt: 9.2,
  dim: 0, didCopy: false,
  nextLaunch: 0.3
};

function launchRocket() {
  var x = rnd(W * 0.20, W * 0.80);
  var targetY = FW.didMorph ? rnd(H * 0.11, H * 0.23) : rnd(H * 0.26, H * 0.47);
  FW.rockets.push({
    x: x, y: H + 8, px: x, py: H + 8,
    vy: -rnd(H * 0.60, H * 0.82),
    targetY: targetY,
    life: 3, pal: pick(PALETTES),
    wob: rnd(0, 6.28)
  });
  launchSound();
}

function explode(x, y, pal) {
  var n = Math.round(clamp(W * H / 6800, 72, 150));
  var kind = Math.random();
  var maxSpeed = Math.min(W * 0.78, H * 0.56);
  for (var i = 0; i < n; i++) {
    var a = (i / n) * 6.2832 + rnd(-0.05, 0.05);
    var sp = maxSpeed * rnd(0.42, 1);
    if (kind < 0.30) { sp = maxSpeed * rnd(0.74, 1.03); }      // 环
    var vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
    if (kind > 0.76) { vy -= maxSpeed * 0.26; }                 // 柳
    var life = rnd(1.1, 2.1);
    FW.sparks.push({
      x: x, y: y, px: x, py: y, vx: vx, vy: vy,
      g: rnd(52, 96), drag: rnd(0.960, 0.978),
      life: life, max: life,
      c: pick(pal), ph: rnd(0, 6.28), sz: rnd(1.1, 2.1)
    });
  }
  FW.flashes.push({ x: x, y: y, r: maxSpeed * 0.26, life: 0.30, max: 0.30 });
  burstSound(0.45);
}

/* --- 文字取样 --- */
function measureSpaced(o, str, size, weight, spacing) {
  o.font = weight + ' ' + size + 'px ' + FONT;
  var chars = str.split(''), total = 0, i;
  for (i = 0; i < chars.length; i++) total += o.measureText(chars[i]).width;
  return total + spacing * (chars.length - 1);
}
function drawSpaced(o, str, cx, cy, size, weight, spacing) {
  o.font = weight + ' ' + size + 'px ' + FONT;
  var chars = str.split(''), i;
  var total = 0;
  for (i = 0; i < chars.length; i++) total += o.measureText(chars[i]).width;
  total += spacing * (chars.length - 1);
  var x = cx - total / 2;
  for (i = 0; i < chars.length; i++) {
    o.fillText(chars[i], x, cy);
    x += o.measureText(chars[i]).width + spacing;
  }
}

function shrink(arr, cap) {
  var out = [];
  for (var i = 0; i < cap; i++) out.push(arr[Math.floor(i * arr.length / cap)]);
  return out;
}

// 网格等密度采样：按格取墨迹质心，保证整体疏密一致
function sampleInk(o, cw, ch, _gap, cap) {
  var img = o.getImageData(0, 0, cw, ch).data;
  var n = 0, i;
  for (i = 3; i < img.length; i += 4) if (img[i] > 128) n++;
  if (!n) return [];
  var g = Math.max(2, Math.round(Math.sqrt(n / Math.max(1, cap))));
  var acc = {};
  for (var y = 0; y < ch; y++) {
    for (var x = 0; x < cw; x++) {
      if (img[(y * cw + x) * 4 + 3] > 128) {
        var k = ((x / g) | 0) + '_' + ((y / g) | 0);
        var c = acc[k];
        if (!c) acc[k] = { x: x, y: y, n: 1 };
        else { c.x += x; c.y += y; c.n++; }
      }
    }
  }
  var pts = [];
  for (var kk in acc) { var a = acc[kk]; pts.push([a.x / a.n, a.y / a.n]); }
  return pts.length > cap ? shrink(pts, cap) : pts;
}

function buildGreetPoints() {
  var oc = document.createElement('canvas');
  oc.width = Math.round(W); oc.height = Math.round(H);
  var o = oc.getContext('2d');
  o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';

  var maxW = W * 0.84;
  var s1 = Math.min(W * 0.20, H * 0.135);
  var w1 = measureSpaced(o, CONFIG.greet, s1, '900', s1 * 0.11);
  if (w1 > maxW) s1 = s1 * (maxW / w1);
  var s2 = s1 * 0.70;
  var w2 = measureSpaced(o, CONFIG.name, s2, '700', s2 * 0.16);
  if (w2 > maxW) s2 = s2 * (maxW / w2);

  var yG = H * 0.385;
  var yN = yG + s1 * 0.60 + s2 * 0.90;

  o.textAlign = 'left';
  drawSpaced(o, CONFIG.greet, W / 2, yG, s1, '900', s1 * 0.11);
  var a = sampleInk(o, oc.width, oc.height, 4, W < 600 ? 900 : 1500);

  o.clearRect(0, 0, oc.width, oc.height);
  o.fillStyle = '#fff';
  drawSpaced(o, CONFIG.name, W / 2, yN, s2, '700', s2 * 0.16);
  var b = sampleInk(o, oc.width, oc.height, 4, W < 600 ? 240 : 380);

  oc.width = 1; oc.height = 1; o = null;
  // 名字那行点更小一点，避免小字号的点糊在一起
  for (var bi = 0; bi < b.length; bi++) b[bi] = [b[bi][0], b[bi][1], 0.95];
  var pts = a.concat(b);
  FW.points = pts;
  return pts;
}

var GSTARS = [];

function morphNow() {
  if (FW.didMorph) return;
  FW.didMorph = true;
  FW.nextLaunch = 1e9;
  var pts = buildGreetPoints();
  FW.points = pts;
  var cx0 = W / 2, cy0 = H * 0.42;
  var n = Math.min(pts.length, W < 600 ? 1100 : 1700);
  GSTARS = [];
  if (!n) return;
  for (var i = 0; i < n; i++) {
    var pi = Math.floor(i * pts.length / n);
    var tx = pts[pi][0], ty = pts[pi][1];
    var ang = Math.atan2(ty - cy0, tx - cx0) + rnd(-0.22, 0.22);
    var R = Math.max(W, H) * rnd(0.62, 0.88);
    var sxp = cx0 + Math.cos(ang) * R;
    var syp = cy0 + Math.sin(ang) * R;
    GSTARS.push({
      sx: sxp, sy: syp,
      tx: tx, ty: ty, x: sxp, y: syp, px: sxp, py: syp,
      age: -rnd(0, 0.60),
      dur: rnd(1.35, 1.95),
      r: rnd(0.66, 1.30) * (pts[pi][2] || 1),
      ph: rnd(0, 6.2832),
      settled: false
    });
  }
  burstSound(0.2);
  tone(523.25, 0.5, 0.035, 'sine');
  setTimeout(function () { tone(659.25, 0.55, 0.03, 'sine'); }, 180);
  setTimeout(function () { tone(783.99, 0.7, 0.028, 'sine'); }, 360);
}

function updateStars(dt) {
  for (var i = 0; i < GSTARS.length; i++) {
    var st = GSTARS[i];
    st.age += dt;
    if (st.age <= 0) continue;
    var p = st.age / st.dur;
    if (p >= 1) {
      st.settled = true;
      st.x = st.tx; st.y = st.ty;
      continue;
    }
    var e = p * p * (3 - 2 * p);
    st.px = st.x; st.py = st.y;
    st.x = st.sx + (st.tx - st.sx) * e;
    st.y = st.sy + (st.ty - st.sy) * e;
  }
}

function retargetGreet() {
  if (!FW.didMorph || !GSTARS.length) return;
  var pts = buildGreetPoints();
  FW.points = pts;
  if (!pts.length) return;
  var n = GSTARS.length;
  for (var i = 0; i < n; i++) {
    var pi = Math.floor(i * pts.length / n);
    var st = GSTARS[i];
    st.tx = pts[pi][0]; st.ty = pts[pi][1];
    st.x = st.tx; st.y = st.ty;
    st.settled = true; st.age = 99;
  }
}

function drawStars() {
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < GSTARS.length; i++) {
    var st = GSTARS[i];
    if (st.age <= 0) continue;
    var p = clamp(st.age / st.dur, 0, 1);
    if (st.settled) {
      var al = 0.88 + 0.12 * Math.sin(clock * 3.4 + st.ph);
      if ((i & 1) === 0) {
        ctx.fillStyle = 'rgba(255,224,176,' + (al * 0.075).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r * 3.4, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,242,220,' + (al * 0.35).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r * 1.45, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,253,246,' + al.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
    } else {
      var al2 = 0.25 + 0.75 * Math.min(1, p * 2.2);
      var dx = st.x - st.px, dy = st.y - st.py;
      if (p > 0.04 && Math.abs(dx) + Math.abs(dy) > 0.6 && Math.abs(dx) + Math.abs(dy) < 200) {
        ctx.strokeStyle = 'rgba(226,232,255,' + (al2 * 0.5).toFixed(3) + ')';
        ctx.lineWidth = Math.max(0.8, st.r * 0.9);
        ctx.beginPath();
        ctx.moveTo(st.x - dx * 3.2, st.y - dy * 3.2);
        ctx.lineTo(st.x, st.y);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(238,243,255,' + al2.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function updateFw(dt) {
  updateStars(dt);
  // 发射节奏（聚字之后就停，别让火箭从字中间穿过去）
  if (!FW.didMorph && t >= FW.nextLaunch) {
    launchRocket();
    var gap;
    if (FW.didMorph) {
      gap = rnd(2.2, 3.2);
    } else if (t < 2.5) {
      gap = rnd(0.95, 1.25);
    } else if (t < 5.5) {
      gap = rnd(0.64, 0.92);
    } else {
      gap = rnd(0.40, 0.62);
      if (Math.random() < 0.4) setTimeout(launchRocket, 280);
    }
    FW.nextLaunch = t + gap;
  }
  if (!FW.didMorph && t >= FW.morphAt) morphNow();
  if (!FW.didCopy && t >= FW.copyAt) { FW.didCopy = true; revealCopy(); }

  // 火箭
  for (var i = FW.rockets.length - 1; i >= 0; i--) {
    var r = FW.rockets[i];
    r.px = r.x; r.py = r.y;
    r.y += r.vy * dt;
    r.x += Math.sin(clock * 5 + r.wob) * 8 * dt;
    r.vy += 30 * dt;
    if (r.y <= r.targetY) {
      explode(r.x, r.y, r.pal);
      FW.rockets.splice(i, 1);
    }
  }

  // 爆点闪光
  for (var fi = FW.flashes.length - 1; fi >= 0; fi--) {
    FW.flashes[fi].life -= dt;
    if (FW.flashes[fi].life <= 0) FW.flashes.splice(fi, 1);
  }

  // 火花
  for (var j = FW.sparks.length - 1; j >= 0; j--) {
    var s = FW.sparks[j];
    s.px = s.x; s.py = s.y;
    var d = Math.pow(s.drag, dt * 60);
    s.vx *= d; s.vy = s.vy * d + s.g * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0) FW.sparks.splice(j, 1);
  }

  // 聚字粒子
  for (var k = 0; k < FW.particles.length; k++) {
    var p = FW.particles[k];
    p.px = p.x; p.py = p.y;
    if (!p.settled) {
      if (p.delay > 0) { p.delay -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; continue; }
      var f = clamp(dt * 60, 0.2, 2.2);
      p.vx += (p.tx - p.x) * 0.021 * f;
      p.vy += (p.ty - p.y) * 0.021 * f;
      var dmp = Math.pow(0.868, f);
      p.vx *= dmp; p.vy *= dmp;
      p.x += p.vx * f; p.y += p.vy * f;
      if (Math.abs(p.tx - p.x) < 0.9 && Math.abs(p.ty - p.y) < 0.9 &&
          Math.abs(p.vx) < 1.6 && Math.abs(p.vy) < 1.6) {
        p.settled = true; p.x = p.tx; p.y = p.ty;
      }
    } else {
      // 落定后轻微呼吸
      p.x = p.tx + Math.sin(clock * 1.6 + p.ph) * 0.55;
      p.y = p.ty + Math.cos(clock * 1.9 + p.ph) * 0.55;
    }
  }
}

var SPRITES = {};
function sparkSprite(color) {
  if (SPRITES[color]) return SPRITES[color];
  var c = document.createElement('canvas');
  c.width = 72; c.height = 18;
  var o = c.getContext('2d');
  var g = o.createLinearGradient(0, 9, 72, 9);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.28, color);
  g.addColorStop(0.66, color);
  g.addColorStop(0.94, '#ffffff');
  g.addColorStop(1, '#ffffff');
  o.fillStyle = g;
  o.beginPath();
  o.moveTo(0, 9);
  o.quadraticCurveTo(42, 2.2, 62, 5);
  o.lineTo(72, 9);
  o.lineTo(62, 13);
  o.quadraticCurveTo(42, 15.8, 0, 9);
  o.closePath();
  o.fill();
  var rg = o.createRadialGradient(64, 9, 0, 64, 9, 9);
  rg.addColorStop(0, 'rgba(255,255,255,0.95)');
  rg.addColorStop(0.45, 'rgba(255,255,255,0.30)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  o.fillStyle = rg;
  o.beginPath(); o.arc(64, 9, 9, 0, 6.2832); o.fill();
  SPRITES[color] = c;
  return c;
}

function drawSparks() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  var i;
  for (i = 0; i < FW.flashes.length; i++) {
    var fl = FW.flashes[i];
    var fa = clamp(fl.life / fl.max, 0, 1);
    var fr = fl.r * (2.4 - fa * 1.2);
    var fg = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, fr);
    fg.addColorStop(0, 'rgba(255,248,232,' + (0.60 * fa).toFixed(3) + ')');
    fg.addColorStop(0.35, 'rgba(255,198,132,' + (0.20 * fa).toFixed(3) + ')');
    fg.addColorStop(1, 'rgba(255,150,90,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fl.x, fl.y, fr, 0, 6.2832); ctx.fill();
  }
  for (i = 0; i < FW.sparks.length; i++) {
    var s = FW.sparks[i];
    var a = clamp(s.life / s.max, 0, 1);
    var alpha = Math.pow(a, 0.55) * (0.88 + 0.12 * Math.sin(clock * 26 + s.ph));
    var tx = s.x - s.vx * 0.065, ty = s.y - s.vy * 0.065;
    ctx.strokeStyle = s.c;
    ctx.globalAlpha = clamp(alpha * 0.72, 0, 1);
    ctx.lineWidth = s.sz * (0.9 + a * 0.6);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.fillStyle = a > 0.74 ? '#fffaf0' : s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.sz * 0.85, 0, 6.2832); ctx.fill();
  }
  // 火箭：拖一条亮的尾迹
  for (i = 0; i < FW.rockets.length; i++) {
    var r = FW.rockets[i];
    var rx = r.x - r.px, ry = r.y - r.py;
    var ang2 = (Math.abs(rx) + Math.abs(ry) > 0.2) ? Math.atan2(ry, rx) : -1.5708;
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(ang2);
    ctx.globalAlpha = 0.9;
    ctx.drawImage(sparkSprite('#ffe0b0'), -52, -5, 52, 10);
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff8e8';
    ctx.beginPath(); ctx.arc(r.x, r.y, 2.1, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawGreet(dt) {
  // 聚字粒子：暗角里透亮，用细线拖影
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (var i = 0; i < FW.particles.length; i++) {
    var p = FW.particles[i];
    var dx = p.x - p.px, dy = p.y - p.py;
    var sp = Math.abs(dx) + Math.abs(dy);
    var tw = 0.86 + 0.14 * Math.sin(clock * 3.4 + p.ph);
    ctx.globalAlpha = clamp(tw, 0, 1);
    ctx.fillStyle = p.c;
    if (sp > 1.1) {
      ctx.strokeStyle = p.c;
      ctx.lineWidth = p.sz * 0.9;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    } else {
      ctx.fillRect(p.x - p.sz * 0.55, p.y - p.sz * 0.55, p.sz * 1.1, p.sz * 1.1);
    }
  }
  // 一层柔光（不用 ctx.filter，软件渲染下 blur 每帧会把帧率拖死）
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = '#ffb066';
  for (var j = 0; j < FW.particles.length; j += 2) {
    var q = FW.particles[j];
    ctx.fillRect(q.x - 3.2, q.y - 3.2, 6.4, 6.4);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  function adj(v) { return Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt)))); }
  return 'rgb(' + adj(r) + ',' + adj(g) + ',' + adj(b) + ')';
}

/* 背景：同一张图放大模糊压暗，铺满整屏，避免出现图片边缘 */
function buildPlate() {
  if (!cakeImgReady) return;
  var c = document.createElement('canvas');
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  var o = c.getContext('2d');
  o.setTransform(DPR, 0, 0, DPR, 0, 0);
  var s = Math.max(W / IMG_W, H / IMG_H) * 1.08;
  var dw = IMG_W * s, dh = IMG_H * s;
  try { o.filter = 'blur(16px)'; } catch (e) {}
  o.drawImage(CAKE_IMG, (W - dw) / 2, (H - dh) / 2, dw, dh);
  o.filter = 'none';
  o.fillStyle = 'rgba(6,3,10,0.58)';
  o.fillRect(0, 0, W, H);
  cake.plate = c;
}

function layoutCake() {
  var prevOut = [];
  for (var q = 0; q < cake.candles.length; q++) prevOut.push(cake.candles[q].out);

  // 让蛋糕主体（图片 y 391..1140）落在屏幕 60% 处
  var fitW = (W * 0.80) / 630;
  var fitH = (H * 0.58) / 749;
  var fit = Math.min(fitW, fitH);
  cake.fit = fit;
  cake.dw = IMG_W * fit; cake.dh = IMG_H * fit;
  cake.dx = (W - cake.dw) / 2;
  cake.dy = H * 0.80 - 1140 * fit;

  // 19 根：外圈 12 + 中圈 6 + 中心 1
  var spec = [];
  var rings = [[12, 0.70, 0], [6, 0.36, 0.26], [1, 0, 0]];
  for (var ri = 0; ri < rings.length; ri++) {
    var cnt = rings[ri][0], rr = rings[ri][1], off = rings[ri][2];
    for (var i = 0; i < cnt; i++) {
      var a = (i / cnt) * 6.2832 + off;
      spec.push({
        x: EC.cx + EC.rx * rr * Math.cos(a),
        y: EC.cy + EC.ry * rr * Math.sin(a),
        back: Math.sin(a)
      });
    }
  }
  spec.sort(function (p, q) { return p.y - q.y; });     // 后面的先画

  cake.candles = [];
  for (var k = 0; k < spec.length; k++) {
    var wasOut = prevOut.length === spec.length
      ? prevOut[k]
      : (cake.allOut || cake.progress >= 0.25 + ((spec.length - 1 - k) / spec.length) * 0.70);
    cake.candles.push({
      x: spec[k].x,
      y: spec[k].y,
      yBase: spec[k].y,
      h: 96 - 12 * spec[k].back,
      w: 13,
      c: CANDLE_COLORS[k % CANDLE_COLORS.length],
      ph: rnd(0, 6.28),
      out: wasOut,
      outAt: 0.25 + ((spec.length - 1 - k) / spec.length) * 0.70,
      lean: 0
    });
  }
  cake.light = cake.allOut ? 0.14 : 1;

  cake.dust = [];
  for (var d = 0; d < 26; d++) {
    cake.dust.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.7, 2.2), vy: rnd(6, 20), ph: rnd(0, 6.28) });
  }
  buildPlate();
}

function updateCake(dt) {
  var level = 0;
  if (holding) level = 1;
  if (micOn) level = Math.max(level, micLevel);
  if (!cake.allOut) {
    if (level > 0.22) cake.progress += level * dt * 0.62;
    else cake.progress -= dt * 0.16;
    cake.progress = clamp(cake.progress, 0, 1);
  }

  for (var i = 0; i < cake.candles.length; i++) {
    var c = cake.candles[i];
    c.lean = c.lean * 0.86 + (level * (c.out ? 0 : 1)) * 1.1 * dt * 6;
    if (!c.out && cake.progress >= c.outAt) {
      c.out = true;
      spawnSmoke(c);
      tone(180 + Math.random() * 80, 0.14, 0.022, 'sine');
    }
  }

  var litLeft = 0;
  for (var li = 0; li < cake.candles.length; li++) if (!cake.candles[li].out) litLeft++;
  if (!cake.allOut && litLeft === 0) {
    cake.allOut = true;
    setTimeout(finishCake, 420);
  }

  cake.target = cake.allOut ? 0.14 : 1;
  cake.light += (cake.target - cake.light) * Math.min(1, dt * 2.2);

  for (var s = cake.smoke.length - 1; s >= 0; s--) {
    var m = cake.smoke[s];
    m.x += m.vx * dt + Math.sin(clock * 2.2 + m.ph) * 12 * dt;
    m.y += m.vy * dt;
    m.vy -= 6 * dt;
    m.r += dt * 8;
    m.life -= dt;
    if (m.life <= 0) cake.smoke.splice(s, 1);
  }

  for (var dd = 0; dd < cake.dust.length; dd++) {
    var du = cake.dust[dd];
    du.y -= du.vy * dt;
    du.x += Math.sin(clock * 0.7 + du.ph) * 6 * dt;
    if (du.y < -12) { du.y = H + 12; du.x = rnd(0, W); }
  }

  for (var q = cake.confetti.length - 1; q >= 0; q--) {
    var cf = cake.confetti[q];
    cf.vy += 210 * dt;
    cf.vx *= 0.995;
    cf.x += cf.vx * dt; cf.y += cf.vy * dt;
    cf.rot += cf.spin * dt;
    cf.life -= dt;
    if (cf.y > H + 40 || cf.life <= 0) cake.confetti.splice(q, 1);
  }
  updateMeter();
}

function spawnSmoke(c) {
  for (var i = 0; i < 7; i++) {
    cake.smoke.push({
      x: c.x + rnd(-3, 3), y: c.yBase - c.h - rnd(0, 8),
      vx: rnd(-9, 9), vy: rnd(-46, -26),
      r: rnd(2, 4), life: rnd(1.2, 2.2), max: 2.2, ph: rnd(0, 6.28)
    });
  }
}

function spawnConfetti() {
  var cols = ['#ffd9a0', '#ff9fb5', '#fff3e2', '#c9b6ff', '#ffc078'];
  for (var i = 0; i < 68; i++) {
    cake.confetti.push({
      x: W / 2 + rnd(-W * 0.42, W * 0.42),
      y: rnd(-H * 0.12, H * 0.26),
      vx: rnd(-120, 120), vy: rnd(-210, -30),
      w: rnd(3, 6), h: rnd(5, 10),
      rot: rnd(0, 6.28), spin: rnd(-8, 8),
      c: pick(cols), life: 5
    });
  }
}

function drawFlame(x, yTop, h, s, lean, seed, gm) {
  gm = (gm == null) ? 1 : gm;
  var fl = 0.86 + 0.14 * Math.sin(clock * 17 + seed) + 0.06 * Math.sin(clock * 29 + seed * 2);
  var hh = h * fl;
  var sway = Math.sin(clock * 6.2 + seed) * hh * 0.10 + lean * hh * 0.55;

  var g = ctx.createRadialGradient(x, yTop - hh * 0.45, 0, x, yTop - hh * 0.45, hh * 2.6);
  g.addColorStop(0, 'rgba(255,196,116,' + (0.30 * cake.light * gm) + ')');
  g.addColorStop(0.45, 'rgba(255,150,70,' + (0.11 * cake.light * gm) + ')');
  g.addColorStop(1, 'rgba(255,120,50,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, yTop - hh * 0.45, hh * 2.6, 0, 6.2832); ctx.fill();

  var gg = ctx.createLinearGradient(x, yTop, x, yTop - hh);
  gg.addColorStop(0, 'rgba(255,220,150,.98)');
  gg.addColorStop(0.45, 'rgba(255,152,62,.95)');
  gg.addColorStop(1, 'rgba(255,110,40,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.moveTo(x, yTop);
  ctx.quadraticCurveTo(x - s * 1.5, yTop - hh * 0.45, x + sway, yTop - hh);
  ctx.quadraticCurveTo(x + s * 1.5, yTop - hh * 0.45, x, yTop);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,252,240,.96)';
  ctx.beginPath();
  ctx.ellipse(x + sway * 0.35, yTop - hh * 0.30, s * 0.5, hh * 0.20, 0, 0, 6.2832);
  ctx.fill();
}

function drawCake() {
  var s = cake.fit, dx = cake.dx, dy = cake.dy;

  // 背景：把图片四条边拉伸铺满，颜色完全连续，不会出现图片边界
  if (cakeImgReady) {
    var bw = dx + cake.dw, bh = dy + cake.dh;
    if (dx > 0) ctx.drawImage(CAKE_IMG, 0, 0, 2, IMG_H, 0, dy, dx + 2, cake.dh);
    if (bw < W) ctx.drawImage(CAKE_IMG, IMG_W - 2, 0, 2, IMG_H, bw - 2, dy, W - bw + 2, cake.dh);
    if (dy > 0) ctx.drawImage(CAKE_IMG, 0, 0, IMG_W, 2, 0, 0, W, dy + 2);
    if (bh < H) ctx.drawImage(CAKE_IMG, 0, IMG_H - 2, IMG_W, 2, 0, bh - 2, W, H - bh + 2);
  } else {
    ctx.fillStyle = '#1a0f22'; ctx.fillRect(0, 0, W, H);
  }

  // 蜡烛整体暖光
  if (cake.light > 0.02) {
    var gx = dx + EC.cx * s, gy = dy + (EC.cy - EC.ry * 0.9) * s;
    var lg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 420 * s);
    lg.addColorStop(0, 'rgba(255,170,110,' + (0.26 * cake.light) + ')');
    lg.addColorStop(0.45, 'rgba(255,140,90,' + (0.09 * cake.light) + ')');
    lg.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  if (cakeImgReady) ctx.drawImage(CAKE_IMG, dx, dy, cake.dw, cake.dh);

  // 蜡烛
  for (var i = 0; i < cake.candles.length; i++) drawCandle(cake.candles[i], s, dx, dy);

  // 烟
  for (var m = 0; m < cake.smoke.length; m++) {
    var sm = cake.smoke[m];
    var a = clamp(sm.life / sm.max, 0, 1) * 0.32;
    var sx = dx + sm.x * s, sy = dy + sm.y * s, sr = sm.r * s * 3.2;
    var mg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    mg.addColorStop(0, 'rgba(222,214,208,' + a + ')');
    mg.addColorStop(1, 'rgba(222,214,208,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.2832); ctx.fill();
  }

  // 浮尘
  ctx.globalCompositeOperation = 'lighter';
  for (var d = 0; d < cake.dust.length; d++) {
    var du = cake.dust[d];
    var da = (0.10 + 0.09 * Math.sin(clock * 1.8 + du.ph)) * (0.5 + cake.light * 0.5);
    ctx.fillStyle = 'rgba(255,214,164,' + clamp(da, 0, 1).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(du.x, du.y, du.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // 彩纸
  for (var q = 0; q < cake.confetti.length; q++) {
    var cf = cake.confetti[q];
    ctx.save();
    ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
    ctx.globalAlpha = clamp(cf.life / 1.2, 0, 1);
    ctx.fillStyle = cf.c;
    ctx.fillRect(-cf.w / 2, -cf.h / 2, cf.w, cf.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawCandle(c, s, dx, dy) {
  var x = dx + c.x * s, y = dy + c.y * s;
  var h = c.h * s, w = c.w * s;
  var topY = y - h;

  // 烛身
  var g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, shade(c.c, -0.30));
  g.addColorStop(0.30, c.c);
  g.addColorStop(0.52, shade(c.c, 0.10));
  g.addColorStop(1, shade(c.c, -0.22));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.lineTo(x - w / 2, topY + w * 0.5);
  ctx.quadraticCurveTo(x - w / 2, topY, x, topY);
  ctx.quadraticCurveTo(x + w / 2, topY, x + w / 2, topY + w * 0.5);
  ctx.lineTo(x + w / 2, y);
  ctx.closePath();
  ctx.fill();

  // 烛芯
  ctx.strokeStyle = '#4a3a30';
  ctx.lineWidth = Math.max(1, 1.6 * s);
  ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x, topY - 5 * s); ctx.stroke();

  if (!c.out) {
    ctx.globalCompositeOperation = 'lighter';
    drawFlame(x, topY - 4 * s, 40 * s, 9.5 * s, c.lean, c.ph, 0.55);
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* =====================================================================
   6. 麦克风 / 按住吹
   ===================================================================== */
var micOn = false, micLevel = 0, holding = false;
var analyser = null, micBuf = null, noiseFloor = 0.02;

function readMic() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(micBuf);
  var sum = 0;
  for (var i = 0; i < micBuf.length; i++) {
    var v = (micBuf[i] - 128) / 128;
    sum += v * v;
  }
  var rms = Math.sqrt(sum / micBuf.length);
  if (rms < noiseFloor * 1.4) noiseFloor = noiseFloor * 0.985 + rms * 0.015;
  var lv = clamp((rms - Math.max(0.035, noiseFloor * 1.8)) / 0.16, 0, 1);
  return lv;
}

function startMic() {
  var btn = document.getElementById('micBtn');
  var hint = document.getElementById('cakeHint');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showFallback('这个浏览器拿不到麦克风，按住下面的按钮吹也一样。');
    return;
  }
  btn.textContent = '正在打开麦克风…';
  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  }).then(function (stream) {
    if (!AC) audioInit();
    if (AC && AC.state === 'suspended') AC.resume();
    var src = AC.createMediaStreamSource(stream);
    analyser = AC.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    micBuf = new Uint8Array(analyser.fftSize);
    micOn = true;
    btn.style.display = 'none';
    document.getElementById('meter').style.display = 'block';
    hint.textContent = '对着手机底部吹一口气，蜡烛会一根根灭。';
  }).catch(function () {
    showFallback('没拿到麦克风权限，按住下面的按钮吹也一样。');
  });
}

function showFallback(msg) {
  document.getElementById('cakeHint').textContent = msg;
  document.getElementById('micBtn').style.display = 'none';
  document.getElementById('holdBtn').style.display = 'inline-block';
  // 保留进度条，按住时也能看到
  document.getElementById('meter').style.display = 'block';
}

function updateMeter() {
  var el = document.getElementById('meterFill');
  if (el) el.style.width = Math.round(cake.progress * 100) + '%';
}

/* =====================================================================
   7. 流程 / UI
   ===================================================================== */
var copyEl = document.getElementById('copy');
var gateEl = document.getElementById('gate');
var fadeEl = document.getElementById('fade');

function renderCopy() {
  copyEl.innerHTML = '';
  for (var i = 0; i < CONFIG.lines.length; i++) {
    var p = document.createElement('p');
    p.textContent = CONFIG.lines[i];
    copyEl.appendChild(p);
  }
  if (CONFIG.sign) {
    var s = document.createElement('p');
    s.textContent = CONFIG.sign;
    s.style.marginTop = '1.1em';
    s.style.fontSize = '1em';
    s.style.opacity = '0.75';
    copyEl.appendChild(s);
  }
}

function revealCopy() {
  var kids = copyEl.children;
  for (var i = 0; i < kids.length; i++) {
    (function (el, i) {
      setTimeout(function () { el.classList.add('on'); }, i * 950);
    })(kids[i], i);
  }
  setTimeout(function () {
    document.getElementById('next').classList.add('on');
  }, kids.length * 950 + 700);
}

function enterCake() {
  var next = document.getElementById('next');
  next.classList.remove('on');
  copyEl.style.opacity = '0';
  fadeEl.classList.add('on');
  setTimeout(function () {
    scene = 'cake';
    paintBg();
    resetCake();
    document.getElementById('cakeHint').textContent = '对着手机，轻轻吹一口气。';
    document.getElementById('cakeUI').classList.add('on');
    document.getElementById('micBtn').style.display = 'inline-block';
    document.getElementById('micBtn').textContent = '点我开始吹';
    document.getElementById('holdBtn').style.display = 'none';
    document.getElementById('meter').style.display = 'none';
    document.getElementById('replayRow').classList.remove('on');
    document.getElementById('wishOut').classList.remove('on');
    document.getElementById('wishOut').textContent = CONFIG.wish;
    fadeEl.classList.remove('on');
  }, 700);
}

function resetCake() {
  cake.progress = 0; cake.done = false; cake.allOut = false;
  cake.smoke = []; cake.confetti = []; cake.light = 1;
  layoutCake();
  for (var i = 0; i < cake.candles.length; i++) cake.candles[i].out = false;
}

function finishCake() {
  if (cake.done) return;
  cake.done = true;
  document.getElementById('meter').style.display = 'none';
  document.getElementById('holdBtn').style.display = 'none';
  document.getElementById('micBtn').style.display = 'none';
  document.getElementById('cakeHint').style.opacity = '0';
  document.getElementById('wishOut').classList.add('on');
  spawnConfetti();
  tone(523.25, 0.6, 0.045, 'sine');
  setTimeout(function () { tone(659.25, 0.6, 0.04, 'sine'); }, 150);
  setTimeout(function () { tone(783.99, 0.9, 0.04, 'sine'); }, 300);
  setTimeout(function () { tone(1046.5, 1.2, 0.03, 'sine'); }, 450);
  setTimeout(function () {
    document.getElementById('replayRow').classList.add('on');
  }, 2600);
}

/* 门 */
function start() {
  if (started) return;
  started = true;
  audioInit();
  if (AC && AC.state === 'suspended') AC.resume();
  startBgm();
  gateEl.classList.add('off');
  renderCopy();
  t = 0;
  setTimeout(function () { gateEl.style.display = 'none'; }, 1300);
}

gateEl.addEventListener('pointerdown', start);
gateEl.addEventListener('touchstart', function (e) { e.preventDefault(); start(); }, { passive: false });

document.getElementById('next').addEventListener('click', enterCake);
document.getElementById('micBtn').addEventListener('click', startMic);
document.getElementById('mute').addEventListener('click', function () {
  muted = !muted;
  var b = document.getElementById('bgm');
  if (b) {
    if (muted) b.pause();
    else { b.muted = false; b.volume = BGM_VOL; var p = b.play(); if (p && p.catch) p.catch(function () {}); }
  }
  this.textContent = muted ? '✕' : '♪';
  this.style.color = muted ? 'rgba(255,226,196,.35)' : 'rgba(255,226,196,.6)';
});
document.getElementById('replay').addEventListener('click', function () {
  document.getElementById('replayRow').classList.remove('on');
  document.getElementById('wishOut').classList.remove('on');
  document.getElementById('cakeHint').style.opacity = '1';
  resetCake();
  if (micOn) {
    document.getElementById('meter').style.display = 'block';
    document.getElementById('cakeHint').textContent = '对着手机底部吹一口气，蜡烛会一根根灭。';
  } else {
    document.getElementById('micBtn').style.display = 'inline-block';
    document.getElementById('holdBtn').style.display = 'none';
    document.getElementById('cakeHint').textContent = '对着手机，轻轻吹一口气。';
  }
});

function restartAll() {
  document.getElementById('replayRow').classList.remove('on');
  document.getElementById('wishOut').classList.remove('on');
  document.getElementById('cakeUI').classList.remove('on');
  document.getElementById('next').classList.remove('on');
  document.getElementById('meter').style.display = 'none';
  document.getElementById('holdBtn').style.display = 'none';
  document.getElementById('cakeHint').style.opacity = '1';
  copyEl.innerHTML = '';
  copyEl.style.opacity = '1';
  renderCopy();

  scene = 'fw';
  t = 0;
  FW.sparks = []; FW.rockets = []; FW.flashes = [];
  FW.particles = []; FW.points = [];
  FW.didMorph = false; FW.didCopy = false; FW.nextLaunch = 0.3;
  GSTARS = [];
  cake.allOut = false; cake.done = false; cake.progress = 0;
  cake.smoke = []; cake.confetti = []; cake.candles = [];
  resetCake();
  paintBg();
}

document.getElementById('again').addEventListener('click', restartAll);

/* 按住吹（无麦克风兜底） */
var holdBtn = document.getElementById('holdBtn');
holdBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); holding = true; });
holdBtn.addEventListener('pointerup', function () { holding = false; });
holdBtn.addEventListener('pointercancel', function () { holding = false; });
holdBtn.addEventListener('pointerleave', function () { holding = false; });
holdBtn.addEventListener('touchstart', function (e) { e.preventDefault(); holding = true; }, { passive: false });
holdBtn.addEventListener('touchend', function () { holding = false; });

/* =====================================================================
   8. 主循环
   ===================================================================== */
var lastMs = 0;
function loop(ms) {
  requestAnimationFrame(loop);
  var now = ms / 1000;
  var dt = lastMs ? now - lastMs : 0.016;
  lastMs = now;
  dt = Math.min(dt, 0.05);
  if (!(dt > 0)) dt = 0;
  clock += dt;
  if (started) t += dt;
  if (micOn) micLevel = readMic();

  ctx.clearRect(0, 0, W, H);
  if (scene === 'fw') {
    if (started) updateFw(dt);
    drawSparks();
    drawStars();
  } else {
    updateCake(dt);
    drawCake();
  }
}

resize();
renderCopy();
requestAnimationFrame(loop);
</script>
